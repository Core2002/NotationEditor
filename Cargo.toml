[package]
name = "notation_editor"
version = "0.1.0"
edition = "2024"
description = "A hexagonal rhythm game and chart editor built with Bevy"
license = "MIT"
repository = "https://github.com/Core2002/NotationEditor"
rust-version = "1.85"

[lib]
name = "notation_editor"
path = "src/lib.rs"

[[bin]]
name = "notation_editor"
path = "src/main.rs"

[dependencies]
bevy = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", default-features = false, features = [
    "ogg",
    "vorbis",
    "wav",
    "pcm",
] }
